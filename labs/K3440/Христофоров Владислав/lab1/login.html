<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему — GustoLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation (Guest) -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark gl-navbar">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <i class="bi bi-fire fs-4 me-2 text-warning"></i>GustoLab
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="register.html" class="gl-btn gl-btn-primary gl-btn-sm">Регистрация</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-auto py-5" style="max-width: 440px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <h3 class="fw-bold mb-1">Авторизация</h3>
                <p class="text-secondary small mb-0">Войдите для публикации рецептов и общения в блоге</p>
            </div>

            <form action="index.html">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Адрес электронной почты</label>
                    <input type="email" class="form-control" placeholder="name@example.com"
                        value="alex_chef@gustolab.ru" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Пароль</label>
                    <input type="password" class="form-control" placeholder="••••••••" value="password123" required>
                </div>

                <button type="submit" class="gl-btn gl-btn-primary w-100 py-2 fw-bold mb-3">Войти в аккаунт</button>

                <div class="text-center small text-secondary">
                    Ещё нет аккаунта? <a href="register.html" class="fw-semibold">Зарегистрироваться</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="gl-footer py-4 mt-auto">
        <div class="container text-center small">
            <p class="mb-1 text-light">&copy; 2026 GustoLab. Сообщество кулинаров и авторские рецепты.</p>
            <p class="mb-0 text-secondary">Кулинарное вдохновение каждый день.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
