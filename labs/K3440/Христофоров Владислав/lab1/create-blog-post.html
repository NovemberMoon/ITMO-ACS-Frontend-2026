<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая статья блога — GustoLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Авторизованная навигация -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark gl-navbar py-0">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <i class="bi bi-fire fs-4 me-2 text-warning"></i>GustoLab
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="blog.html" class="gl-btn gl-btn-outline text-dark btn-sm"><i class="bi bi-arrow-left"></i>В
                        блог</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 820px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <h2 class="fw-bold mb-1">Создание статьи в кулинарный блог</h2>
            <p class="text-secondary small mb-4">Поделитесь профессиональным опытом, рассказом об ингредиентах или
                технологиях кухни.</p>

            <form id="createBlogForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Заголовок статьи *</label>
                    <input type="text" name="title" class="form-control"
                        placeholder="Например: Секреты ферментации теста для пиццы" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Текст статьи *</label>
                    <textarea name="content" class="form-control" rows="8"
                        placeholder="Изложите суть публикации, рекомендации и выводы..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Обложка публикации</label>
                    <div class="gl-upload-zone" id="blogDropZone">
                        <i class="bi bi-image display-6 text-secondary d-block mb-2"></i>
                        <span class="small fw-semibold d-block mb-1">Выберите файл изображения</span>
                        <input type="file" id="blogFileInput" class="d-none" accept="image/*">
                        <button type="button" class="gl-btn gl-btn-outline btn-sm"
                            onclick="document.getElementById('blogFileInput').click()">
                            <i class="bi bi-folder2-open"></i>Обзор файлов
                        </button>
                    </div>
                    <div id="blogPreviewContainer" class="mt-3 d-none text-center">
                        <img id="blogPreviewImg" src="" class="gl-preview-img" alt="Обложка">
                    </div>
                </div>

                <button type="submit" class="gl-btn gl-btn-primary w-100 py-2.5 fw-bold">Опубликовать статью</button>
            </form>
        </div>
    </main>

    <footer class="footer-gl py-4 mt-auto text-center small">
        &copy; 2026 GustoLab. Университет ИТМО.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
