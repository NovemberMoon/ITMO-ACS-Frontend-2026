<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация кулинара — GustoLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Гостевая навигация -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark gl-navbar py-0">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <i class="bi bi-fire fs-4 me-2 text-warning"></i>GustoLab
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="login.html" class="gl-btn gl-btn-outline text-dark btn-sm">Вход</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-auto py-5" style="max-width: 460px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <h3 class="fw-bold mb-1">Регистрация шефа</h3>
                <p class="text-secondary small mb-0">Присоединяйтесь к кулинарному сообществу</p>
            </div>

            <form action="index.html">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Имя пользователя (username) *</label>
                    <input type="text" class="form-control" placeholder="alex_chef" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Электронная почта (email) *</label>
                    <input type="email" class="form-control" placeholder="chef@example.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Пароль (не менее 6 символов) *</label>
                    <input type="password" class="form-control" placeholder="••••••••" minlength="6" required>
                </div>

                <button type="submit" class="gl-btn gl-btn-primary w-100 py-2 fw-bold mb-3">Зарегистрироваться</button>

                <div class="text-center small text-secondary">
                    Уже зарегистрированы? <a href="login.html" class="fw-semibold">Войти в аккаунт</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer-gl py-4 mt-auto text-center small">
        &copy; 2026 GustoLab. Университет ИТМО.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
