<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование статьи — GustoLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark gl-navbar">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <i class="bi bi-fire fs-4 me-2 text-warning"></i>GustoLab
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                    aria-controls="navContent" aria-expanded="false" aria-label="Переключить навигацию">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navContent">
                    <ul class="navbar-nav me-auto ms-lg-3 mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Рецепты</a></li>
                        <li class="nav-item"><a class="nav-link active" href="blog.html">Кулинарный блог</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <div class="dropdown">
                            <button class="gl-btn gl-btn-primary gl-btn-sm dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-plus-lg"></i>Создать
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                                <li><a class="dropdown-item py-2" href="create-recipe.html"><i
                                            class="bi bi-journal-plus me-2 text-danger"></i>Новый рецепт</a></li>
                                <li><a class="dropdown-item py-2" href="create-blog-post.html"><i
                                            class="bi bi-pencil-square me-2 text-success"></i>Новая статья</a></li>
                            </ul>
                        </div>
                        <div class="d-flex align-items-center ps-3 border-start border-secondary">
                            <a href="profile.html"
                                class="d-flex align-items-center text-decoration-none text-light me-3">
                                <img src="https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=100&auto=format&fit=crop&q=80"
                                    class="rounded-circle me-2" style="width: 34px; height: 34px; object-fit: cover;"
                                    alt="Шеф-повар">
                                <span class="small fw-semibold">Алексей С.</span>
                            </a>
                            <a href="login.html" class="btn btn-outline-danger btn-sm py-1 px-2"
                                title="Выйти из аккаунта">
                                <i class="bi bi-box-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 820px;">
        <a href="blog-post.html" class="gl-back-link"><i class="bi bi-arrow-left me-1"></i>Вернуться к статье</a>

        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <h2 class="fw-bold mb-1">Редактирование публикации</h2>
            <p class="text-secondary small mb-4">Внесите правки в заголовок или текст кулинарной статьи.</p>

            <form id="editBlogForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Заголовок статьи *</label>
                    <input type="text" name="title" class="form-control"
                        value="Азиатские пряности: баланс пяти вкусов в домашней кухне" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Текст статьи *</label>
                    <textarea name="content" class="form-control" rows="8"
                        required>Паназиатская кулинарная традиция базируется на строгом равновесии пяти вкусовых ощущений: сладкого, кислого, острого, соленого и умами...</textarea>
                </div>

                <div class="d-flex gap-2">
                    <a href="blog-post.html" class="gl-btn gl-btn-outline w-50 py-2">Отмена</a>
                    <button type="submit" class="gl-btn gl-btn-primary w-50 py-2 fw-bold">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="gl-footer py-4 mt-auto">
        <div class="container text-center small">
            <p class="mb-1 text-light">&copy; 2026 GustoLab. Сообщество кулинаров и авторские рецепты.</p>
            <p class="mb-0 text-secondary">Кулинарное вдохновение каждый день.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
