<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование статьи — GustoLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/light.css" media="(prefers-color-scheme: light)" id="themeLightLink">
    <link rel="stylesheet" href="../css/dark.css" media="(prefers-color-scheme: dark)" id="themeDarkLink">
    <link rel="stylesheet" href="../css/style.css">
    <script>
        (function () {
            var saved = localStorage.getItem("gustolab_theme");
            if (saved === "light" || saved === "dark") {
                document.getElementById("themeLightLink").media = saved === "light" ? "all" : "not all";
                document.getElementById("themeDarkLink").media = saved === "dark" ? "all" : "not all";
            }
        })();
    </script>
</head>

<body>
    <a href="#mainContent" class="gl-skip-link">Перейти к основному содержимому</a>

    <!-- Навигация -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark gl-navbar py-0" aria-label="Основная навигация">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="../index.html">
                    <i class="bi bi-fire fs-4 me-2 text-warning" aria-hidden="true"></i>GustoLab
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                    aria-controls="navContent" aria-expanded="false" aria-label="Переключить навигацию">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navContent">
                    <ul class="navbar-nav me-auto ms-lg-3 mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Рецепты</a></li>
                        <li class="nav-item"><a class="nav-link active" href="blog.html">Кулинарный блог</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <button type="button" class="gl-theme-btn" id="themeToggleBtn"
                            aria-label="Переключить на тёмную тему" aria-pressed="false" title="Тёмная тема">
                            <i class="bi bi-moon-stars-fill" id="themeToggleIcon" aria-hidden="true"></i>
                            <span class="d-lg-none small" id="themeToggleLabel">Тёмная тема</span>
                        </button>
                        <div class="d-flex align-items-center gap-3" id="headerAuthContainer"></div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main id="mainContent" tabindex="-1" class="container my-5" style="max-width: 820px;">
        <a href="blog.html" id="backToBlogPostLink" class="gl-back-link"><i class="bi bi-arrow-left me-1"
                aria-hidden="true"></i>Вернуться
            к статье</a>

        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <h1 class="h2 fw-bold mb-1">Редактирование публикации</h1>
            <p class="text-secondary small mb-4">Внесите правки в заголовок, обложку или текст кулинарной статьи.</p>

            <form id="editBlogForm">
                <div class="mb-3">
                    <label for="blogTitle" class="form-label small fw-semibold">Заголовок статьи *</label>
                    <input type="text" id="blogTitle" name="title" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label for="blogContent" class="form-label small fw-semibold">Текст статьи *</label>
                    <textarea name="content" id="blogContent" class="form-control" rows="8" required></textarea>
                </div>

                <!-- Замена или удаление обложки статьи -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Обложка публикации</label>
                    <div class="gl-upload-zone p-3 text-center" id="blogDropZone">
                        <div id="coverPreviewContainer" class="mb-3 d-none">
                            <div class="position-relative d-inline-block">
                                <img id="coverPreviewImg" class="gl-preview-img" alt="Обложка">
                                <button type="button"
                                    class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 rounded-circle"
                                    id="removeCoverBtn" style="width: 28px; height: 28px; padding: 0;"
                                    aria-label="Удалить обложку публикации">
                                    <i class="bi bi-x" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <input type="file" id="coverFileInput" class="d-none" accept="image/*">
                        <button type="button" class="gl-btn gl-btn-outline gl-btn-sm"
                            onclick="document.getElementById('coverFileInput').click()">
                            <i class="bi bi-camera" aria-hidden="true"></i>Выбрать обложку
                        </button>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a href="blog.html" id="cancelEditBlogLink" class="gl-btn gl-btn-outline w-50 py-2">Отмена</a>
                    <button type="submit" class="gl-btn gl-btn-primary w-50 py-2 fw-bold">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Подвал страницы -->
    <footer class="gl-footer py-4 mt-auto">
        <div class="container text-center small">
            <p class="mb-1 text-light">&copy; 2026 GustoLab. Сообщество кулинаров и авторские рецепты.</p>
            <p class="mb-0 gl-footer-muted">Кулинарное вдохновение каждый день.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/forms-page.js"></script>
</body>

</html>
