<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему — GustoLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <a href="#mainContent" class="gl-skip-link">Перейти к основному содержимому</a>

    <!-- Навигация -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark gl-navbar py-0" aria-label="Основная навигация">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="../index.html">
                    <i class="bi bi-fire fs-4 me-2 text-warning" aria-hidden="true"></i>GustoLab
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
                    aria-controls="navContent" aria-expanded="false" aria-label="Переключить навигацию">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navContent">
                    <ul class="navbar-nav me-auto ms-lg-3 mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Рецепты</a></li>
                        <li class="nav-item"><a class="nav-link" href="blog.html">Кулинарный блог</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3" id="headerAuthContainer"></div>
                </div>
            </div>
        </nav>
    </header>

    <main id="mainContent" tabindex="-1" class="container my-auto py-5" style="max-width: 440px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold mb-1">Авторизация</h1>
                <p class="text-secondary small mb-0">Войдите для публикации рецептов и общения в блоге</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label small fw-semibold">Адрес электронной почты</label>
                    <input type="email" id="loginEmail" name="email" class="form-control"
                        placeholder="alex_chef@gustolab.ru" required>
                </div>

                <div class="mb-4">
                    <label for="loginPassword" class="form-label small fw-semibold">Пароль</label>
                    <input type="password" id="loginPassword" name="password" class="form-control"
                        placeholder="••••••••" required>
                </div>

                <button type="submit" id="btnLoginSubmit" class="gl-btn gl-btn-primary w-100 py-2 fw-bold mb-3">Войти в
                    аккаунт</button>

                <div class="text-center small text-secondary">
                    Ещё нет аккаунта? <a href="register.html" class="fw-semibold">Зарегистрироваться</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Подвал страницы -->
    <footer class="gl-footer py-4 mt-auto">
        <div class="container text-center small">
            <p class="mb-1 text-light">&copy; 2026 GustoLab. Сообщество кулинаров и авторские рецепты.</p>
            <p class="mb-0 gl-footer-muted">Кулинарное вдохновение каждый день.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/auth-page.js"></script>
</body>

</html>
